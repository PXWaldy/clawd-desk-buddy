# Runs when a version tag like v1.2.0 is pushed:
#   1. builds the firmware with that version
#   2. creates a GitHub release with the binaries
#   3. deploys the web flasher with the new firmware to Cloudflare
#      (https://pxwaldy.com/clawd-desk-buddy/)
#
# Needs two repository secrets, see "Releases" in the README:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # create the release

# Never run two deploys at the same time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build firmware
        env:
          CLAWD_VERSION: ${{ github.ref_name }}
        run: pio run

      - name: Collect binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Merged image (bootloader + partitions + app) for the web flasher and esptool
          cp .pio/build/clawd/firmware.factory.bin "dist/clawd-desk-buddy-${version}-factory.bin"
          # App image for updates through the web UI
          cp .pio/build/clawd/firmware.bin "dist/clawd-desk-buddy-${version}-ota.bin"

      - name: Build web flasher
        # Page, fonts, merged firmware and a manifest with the new version,
        # all in flasher/dist and all served from the same address.
        run: python3 scripts/build_flasher.py --version "$GITHUB_REF_NAME"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true

      - name: Deploy web flasher to Cloudflare
        working-directory: flasher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The version is pinned: "base_path" in wrangler.jsonc needs 4.148.0 or later
        run: npx --yes wrangler@4.162.0 deploy

      - name: Check that the flasher serves the new firmware
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://pxwaldy.com/clawd-desk-buddy"
          for attempt in 1 2 3 4 5 6; do
            online="$(curl -fsS "$base/manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)"
            if [ "$online" = "$version" ] && curl -fsS -o /tmp/online.bin "$base/firmware.bin" \
               && cmp -s /tmp/online.bin flasher/dist/firmware.bin; then
              echo "Flasher is online with firmware $version"
              exit 0
            fi
            echo "Not updated yet (manifest says '$online'), trying again"
            sleep 10
          done
          echo "::error::The flasher at $base does not serve firmware $version"
          exit 1
