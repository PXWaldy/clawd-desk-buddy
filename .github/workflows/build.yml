# Builds the firmware on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from "git describe"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build firmware
        run: pio run

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/clawd/firmware.bin
            .pio/build/clawd/firmware.factory.bin
