; Clawd Desk Buddy - PlatformIO project configuration
; Board: Waveshare ESP32-C6-Touch-LCD-1.47 (ESP32-C6FH8, 8 MB flash)

[platformio]
default_envs = clawd

[env:clawd]
; pioarduino: community platform that ships Arduino core 3.x with ESP32-C6 support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
extra_scripts =
    pre:scripts/embed_web.py
    pre:scripts/version.py
lib_deps =
    lovyan03/LovyanGFX@1.3.0
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
